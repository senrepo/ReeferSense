# /pipelines/templates/deploy-aca.yml
parameters:
  dependsOn: []          # e.g., docker_build_push
  acrLoginServer: ''
  resourceGroup:  ''
  containerApp:   ''
  acaEnvironment: ''

jobs:
- job: deploy_aca
  ${{ if gt(length(parameters.dependsOn), 0) }}:
    dependsOn: ${{ parameters.dependsOn }}
  displayName: Create or Update Container App
  steps:
  - task: AzureCLI@2
    displayName: Create or Update Container App
    inputs:
      azureSubscription: $(azureSubscription)   # ARM service connection name from var group
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        RG="${{ parameters.resourceGroup }}"
        APP="${{ parameters.containerApp }}"
        ENV_NAME="${{ parameters.acaEnvironment }}"
        ACR_LOGIN="${{ parameters.acrLoginServer }}"

        IMAGE="${ACR_LOGIN}/$(imageName):$(Build.SourceBranchName)-$(Build.BuildId)"
        echo "Target RG=${RG}, App=${APP}, Env=${ENV_NAME}, Image=${IMAGE}, DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT}"

        if ! az containerapp show -n "${APP}" -g "${RG}" >/dev/null 2>&1; then
          echo "Creating Container App ${APP}..."
          ACR_NAME="$(echo "${ACR_LOGIN}" | cut -d. -f1)"
          az acr update -n "${ACR_NAME}" --admin-enabled true 1>/dev/null
          ACR_USER="$(az acr credential show -n "${ACR_NAME}" --query username -o tsv)"
          ACR_PASS="$(az acr credential show -n "${ACR_NAME}" --query passwords[0].value -o tsv)"

          # CREATE: use --env-vars
          az containerapp create --name "${APP}" --resource-group "${RG}" --environment "${ENV_NAME}" \
            --image "${IMAGE}" --registry-server "${ACR_LOGIN}" --registry-username "${ACR_USER}" --registry-password "${ACR_PASS}" \
            --ingress external --transport tcp --target-port 9000 --exposed-port 9000 \
            --env-vars DOTNET_ENVIRONMENT="${DOTNET_ENVIRONMENT}" AppSettings__ServiceBus__ConnectionString="${SB_CONNECTION_STRING}" AppSettings__ServiceBus__QueueName="${QUEUE_NAME}" AppSettings__SqlServer__ConnectionString="${SQL_CONNECTION_STRING}"
        else
          echo "Updating Container App ${APP}..."
          # UPDATE: keep --set-env-vars
          az containerapp update --name "${APP}" --resource-group "${RG}" --image "${IMAGE}" \
            --set-env-vars DOTNET_ENVIRONMENT="${DOTNET_ENVIRONMENT}" AppSettings__ServiceBus__ConnectionString="${SB_CONNECTION_STRING}" AppSettings__ServiceBus__QueueName="${QUEUE_NAME}" AppSettings__SqlServer__ConnectionString="${SQL_CONNECTION_STRING}"

          # Ensure ingress is external TCP on 9000 -> 9000 (idempotent)
          az containerapp ingress update -n "${APP}" -g "${RG}" \
            --type external --transport tcp --target-port 9000 --exposed-port 9000
        fi
    env:
      DOTNET_ENVIRONMENT: Development
      SB_CONNECTION_STRING: $(SB_CONNECTION_STRING)
      QUEUE_NAME: $(QUEUE_NAME)
      SQL_CONNECTION_STRING : $(SQL_CONNECTION_STRING)