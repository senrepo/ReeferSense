# /pipelines/iot-gateway/azure-pipelines-dev.yml

trigger:
  branches: { include: [ dev ] }
  paths:
    include:
      - iot-gateway/**                 # project files
      - iot-gateway/Dockerfile         # Dockerfile path (match reality)
      - pipelines/iot-gateway/**       # this pipeline file(s)
      - pipelines/templates/**         # shared templates

pr:
  branches: { include: [ dev ] }
  paths:
    include:
      - iot-gateway/**
      - iot-gateway/Dockerfile         # match trigger path
      - pipelines/iot-gateway/**
      - pipelines/templates/**

# Load env-level first, then project-level (project overrides if key collision)
variables:
- group: env-dev
- group: iot-gateway-dev

# Repo-specific values
- name: project
  value: iot-gateway/iot-gateway.csproj
- name: dockerfilePath
  value: iot-gateway/Dockerfile
- name: imageName
  value: iot-gateway
- name: buildConfiguration
  value: Release

stages:
# -------- Build for push & PR --------
- stage: Build
  displayName: Build iot-gateway (Dev)
  jobs:
  - template: ../templates/build-dotnet.yml
    parameters:
      project: $(project)
      configuration: $(buildConfiguration)

# -------- Release (skip on PRs) --------
- stage: Release
  displayName: Docker → ACR → ACA (Dev)
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - template: ../templates/docker-buildpush.yml
    parameters:
      containerRegistryServiceConnection: $(acrServiceConnection)  # from env-dev
      repository: $(imageName)
      dockerfilePath: $(Build.SourcesDirectory)/$(dockerfilePath)
      buildContext: '$(Pipeline.Workspace)/publish/app'

  - job: deploy_aca
    displayName: Deploy to ACA (Dev)
    dependsOn: docker_build_push
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: Update ACA revision
      inputs:
        azureSubscription: '$(azureSubscription)'   # from env-dev
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          IMAGE="$(acrLoginServer)/$(imageName):$(Build.SourceBranchName)-$(Build.BuildId)"
          az containerapp update \
            --name "$(containerApp)" \
            --resource-group "$(resourceGroup)" \
            --image "$IMAGE" \
            --set-env-vars \
              DOTNET_ENVIRONMENT=Development \
              SERVICEBUS__CONNECTION_STRING="$(SB_CONNECTION_STRING)" \
              SERVICEBUS__QUEUENAME="$(QUEUE_NAME)"
