pool:
  vmImage: windows-latest     # sqlproj requires Windows image with VS

trigger:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

pr:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

variables:
- group: env-dev 
- group: database-dev

# Repo-specific values
- name: project
  value: reefer-sense-db/reefer-sense-db.sqlproj
- name: dacpacFileName
  value: reefer-sense-db.dacpac
- name: buildConfiguration
  value: Release

# ACR settings project-specific
- name: acrRepository
  value: dacpacs
- name: acrTag
  value: $(Build.SourceBranchName)-$(Build.BuildId)

stages:
# -------- Build for push & PR --------
- stage: Build
  displayName: Build database (.sqlproj → .dacpac)
  jobs:
  - job: build_dacpac
    displayName: Build DACPAC (VSBuild)
    steps:
    - checkout: self

    - task: VSBuild@1
      displayName: Build SQL Project
      inputs:
        solution: '$(project)'
        msbuildArgs: '/p:Configuration=$(buildConfiguration)'
        platform: 'Any CPU'
        configuration: '$(buildConfiguration)'

    - powershell: |
        $root   = Split-Path "$(project)"
        $search = Join-Path "$(Build.SourcesDirectory)" $root
        $file   = "$(dacpacFileName)" 

        $dacpac = Get-ChildItem -Path $search -Recurse -File -Filter $file -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTimeUtc -Descending |
                  Select-Object -First 1

        if (-not $dacpac) {
          Write-Host "Searched: $search (looking for: $file)"
          throw "DACPAC not found"
        }

        # IMPORTANT: set the FULL PATH, not just the name
        Write-Host "DACPAC full path: $($dacpac.FullName)"
        Write-Host "##vso[task.setvariable variable=DacpacPath;isOutput=true]$($dacpac.FullName)"
      name: outvars
      displayName: Locate DACPAC

    - task: PublishPipelineArtifact@1
      displayName: Publish DACPAC (pipeline artifact)
      inputs:
        targetPath: '$(outvars.DacpacPath)'
        artifact: 'dacpac'
        publishLocation: 'pipeline'

# -------- Release (skip on PRs) --------
- stage: Release
  displayName: Push DACPAC to ACR (Dev)
  dependsOn: Build
  condition: and ( succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest') )
  jobs:
  - job: acr_push
    displayName: ORAS → ACR (sha + latest) on Windows
    pool:
      vmImage: windows-latest
    variables:
      ORAS_VERSION: '1.3.0'
    steps:
    - download: current
      artifact: dacpac

    # Auth to Azure and mint ACR access token (stored as secure pipeline var)
    - task: AzureCLI@2
      displayName: Azure login + mint ACR token
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az account show -o table
          $token = az acr login --name "$(acrName)" --expose-token --query accessToken -o tsv
          if (-not $token) { throw "Failed to obtain ACR access token." }
          Write-Host "##vso[task.setvariable variable=acrAccessToken;issecret=true]$token"

    # Install ORAS (Windows) and expose to PATH for next step
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ver      = '$(ORAS_VERSION)'
        $tmp      = $env:AGENT_TEMPDIRECTORY
        $zip      = Join-Path $tmp "oras_$ver.zip"
        $url      = "https://github.com/oras-project/oras/releases/download/v$ver/oras_${ver}_windows_amd64.zip"
        $extract  = Join-Path $tmp "oras_$ver"
        $bindir   = Join-Path $tmp "oras-bin"

        Write-Host "Downloading ORAS $ver from $url"
        Invoke-WebRequest -Uri $url -OutFile $zip

        if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
        Expand-Archive -Path $zip -DestinationPath $extract -Force

        $orasExe = Get-ChildItem -Path $extract -Recurse -File -Filter 'oras.exe' | Select-Object -First 1
        if (-not $orasExe) { throw "oras.exe not found under $extract" }

        if (!(Test-Path $bindir)) { New-Item -ItemType Directory -Path $bindir | Out-Null }
        Copy-Item -Path $orasExe.FullName -Destination (Join-Path $bindir 'oras.exe') -Force

        # Make available now and to subsequent tasks
        $env:PATH = "$bindir;$env:PATH"
        Write-Host "##vso[task.prependpath]$bindir"

        & (Join-Path $bindir 'oras.exe') version
      displayName: Install ORAS (Windows)

    # Push DACPAC with SHA & latest tags (Windows-safe: push from file's directory)
    - powershell: |
        $ErrorActionPreference = 'Stop'

        $dacpac = "$(Pipeline.Workspace)\dacpac\$(dacpacFileName)"
        if (-not (Test-Path $dacpac)) { throw "DACPAC not found at $dacpac" }

        # ORAS login with ACR bearer token (from prior step)
        $token = "$(acrAccessToken)"
        if (-not $token) { throw "acrAccessToken not found. Ensure previous AzureCLI step succeeded." }

        # prefer password-stdin; if it fails on your agent, fall back to --password
        try {
          $token | oras login "$(acrLoginServer)" --username 00000000-0000-0000-0000-000000000000 --password-stdin
        } catch {
          Write-Warning "password-stdin failed; falling back to --password"
          oras login "$(acrLoginServer)" --username 00000000-0000-0000-0000-000000000000 --password $token
        }

        $refSha    = "$(acrLoginServer)/$(acrRepository):$(acrTag)"
        $refLatest = "$(acrLoginServer)/$(acrRepository):latest"
        Write-Host "Targets:`n  SHA: $refSha`n  Latest: $refLatest"

        # Work around Windows drive-letter colon: push from file's directory, use only filename
        $dir  = Split-Path $dacpac -Parent
        $file = Split-Path $dacpac -Leaf
        Push-Location $dir
        try {
          Write-Host "Pushing (SHA)…"
          oras push "$refSha"    --artifact-type application/vnd.microsoft.dacpac "$file:application/vnd.microsoft.dacpac"
          Write-Host "Pushing (latest)…"
          oras push "$refLatest" --artifact-type application/vnd.microsoft.dacpac "$file:application/vnd.microsoft.dacpac"
        } finally {
          Pop-Location
        }

        Write-Host "Done: $refSha and $refLatest"
      displayName: Push DACPAC to ACR (Windows-safe)




