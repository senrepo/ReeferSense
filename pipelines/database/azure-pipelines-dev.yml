pool:
  vmImage: windows-latest     # sqlproj requires Windows image with VS

trigger:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

pr:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

variables:
- group: env-dev 
- group: database-dev

# Repo-specific values
- name: project
  value: reefer-sense-db/reefer-sense-db.sqlproj
- name: dacpacFileName
  value: reefer-sense-db.dacpac
- name: buildConfiguration
  value: Release

# ACR settings project-specific
- name: acrRepository
  value: dacpacs
- name: acrTag
  value: $(Build.SourceBranchName)-$(Build.BuildId)
- name: ORAS_VERSION
  value: 1.3.0

stages:
# -------- Build for push & PR --------
- stage: Build
  displayName: Build database (.sqlproj → .dacpac)
  jobs:
  - job: build_dacpac
    displayName: Build DACPAC (VSBuild)
    steps:
    - checkout: self

    - task: VSBuild@1
      displayName: Build SQL Project
      inputs:
        solution: '$(project)'
        msbuildArgs: '/p:Configuration=$(buildConfiguration)'
        platform: 'Any CPU'
        configuration: '$(buildConfiguration)'

    - powershell: |
        $root   = Split-Path "$(project)"
        $search = Join-Path "$(Build.SourcesDirectory)" $root
        $file   = "$(dacpacFileName)" 

        $dacpac = Get-ChildItem -Path $search -Recurse -File -Filter $file -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTimeUtc -Descending |
                  Select-Object -First 1

        if (-not $dacpac) {
          Write-Host "Searched: $search (looking for: $file)"
          throw "DACPAC not found"
        }

        # IMPORTANT: set the FULL PATH, not just the name
        Write-Host "DACPAC full path: $($dacpac.FullName)"
        Write-Host "##vso[task.setvariable variable=DacpacPath;isOutput=true]$($dacpac.FullName)"
      name: outvars
      displayName: Locate DACPAC

    - task: PublishPipelineArtifact@1
      displayName: Publish DACPAC (pipeline artifact)
      inputs:
        targetPath: '$(outvars.DacpacPath)'
        artifact: 'dacpac'
        publishLocation: 'pipeline'

# -------- Release (skip on PRs) --------
- stage: Release
  displayName: Push DACPAC to ACR (Dev)
  dependsOn: Build
  condition: and( succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest') )
  jobs:
  - job: acr_push
    displayName: oras push → ACR (sha + latest)
    steps:
    - download: current
      artifact: dacpac

    - task: AzureCLI@2
      displayName: Azure login (ARM svc conn)
      inputs:
        azureSubscription: '$(azureSubscription)'  
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az account show -o table

    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ver = '$(ORAS_VERSION)'
        $zip = "$env:AGENT_TEMPDIRECTORY\oras_$ver.zip"
        $url = "https://github.com/oras-project/oras/releases/download/v$ver/oras_${ver}_windows_amd64.zip"
        $extract = "$env:AGENT_TEMPDIRECTORY\oras_$ver"

        Write-Host "Downloading ORAS $ver from $url"
        Invoke-WebRequest -Uri $url -OutFile $zip

        Write-Host "Extracting to $extract"
        Expand-Archive -Path $zip -DestinationPath $extract -Force

        # Put oras.exe into agent temp and prepend PATH for subsequent tasks
        Copy-Item -Path (Join-Path $extract 'oras.exe') -Destination $env:AGENT_TEMPDIRECTORY -Force

        # Make it available to later tasks in this job
        Write-Host "##vso[task.prependpath]$env:AGENT_TEMPDIRECTORY"

        # Verify
        oras version
        
      displayName: 'Install ORAS (PowerShell)' 

    - powershell: |
        $ErrorActionPreference = 'Stop'

        # Locate the DACPAC previously published & downloaded as a pipeline artifact
        $dacpac = "$(Pipeline.Workspace)\dacpac\$(dacpacFileName)"
        if (-not (Test-Path $dacpac)) {
          throw "DACPAC not found at $dacpac"
        }
        Write-Host "DACPAC: $dacpac"

        # Login to ACR (use ACR *name*, not login server)
        az acr login --name "$(acrLoginServer)"

        # Build refs
        $refSha    = "$(acrLoginServer)/$(acrRepository):$(acrTag)"
        $refLatest = "$(acrLoginServer)/$(acrRepository):latest"
        Write-Host "Target refs: `n  SHA: $refSha`n  Latest: $refLatest"

        # Push SHA tag
        Write-Host "Pushing to $refSha"
        oras push $refSha --artifact-type application/vnd.microsoft.dacpac "$dacpac:application/vnd.microsoft.dacpac"

        # Push 'latest' tag
        Write-Host "Tagging latest → $refLatest"
        oras push $refLatest --artifact-type application/vnd.microsoft.dacpac "$dacpac:application/vnd.microsoft.dacpac"

        Write-Host "Done: $refSha and $refLatest"
      displayName: Push DACPAC to ACR
