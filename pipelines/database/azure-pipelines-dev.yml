pool:
  vmImage: windows-latest     # sqlproj requires Windows image with VS

trigger:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

pr:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

variables:
- group: env-dev 
- group: database-dev

# Repo-specific values
- name: project
  value: reefer-sense-db/reefer-sense-db.sqlproj
- name: dacpacFileName
  value: reefer-sense-db.dacpac
- name: buildConfiguration
  value: Release

# ACR settings project-specific
- name: acrRepository
  value: dacpacs
- name: acrTag
  value: $(Build.SourceBranchName)-$(Build.BuildId)

stages:
# -------- Build for push & PR --------
- stage: Build
  displayName: Build database (.sqlproj → .dacpac)
  jobs:
  - job: build_dacpac
    displayName: Build DACPAC (VSBuild)
    steps:
    - checkout: self

    - task: VSBuild@1
      displayName: Build SQL Project
      inputs:
        solution: '$(project)'
        msbuildArgs: '/p:Configuration=$(buildConfiguration)'
        platform: 'Any CPU'
        configuration: '$(buildConfiguration)'

    - powershell: |
        $root   = Split-Path "$(project)"
        $search = Join-Path "$(Build.SourcesDirectory)" $root
        $file   = "$(dacpacFileName)" 

        $dacpac = Get-ChildItem -Path $search -Recurse -File -Filter $file -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTimeUtc -Descending |
                  Select-Object -First 1

        if (-not $dacpac) {
          Write-Host "Searched: $search (looking for: $file)"
          throw "DACPAC not found"
        }

        # IMPORTANT: set the FULL PATH, not just the name
        Write-Host "DACPAC full path: $($dacpac.FullName)"
        Write-Host "##vso[task.setvariable variable=DacpacPath;isOutput=true]$($dacpac.FullName)"
      name: outvars
      displayName: Locate DACPAC

    - task: PublishPipelineArtifact@1
      displayName: Publish DACPAC (pipeline artifact)
      inputs:
        targetPath: '$(outvars.DacpacPath)'
        artifact: 'dacpac'
        publishLocation: 'pipeline'

# -------- Release (skip on PRs) --------
- stage: Release
  displayName: Push DACPAC to ACR (Dev)
  dependsOn: Build
  condition: and ( succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest') )
  jobs:
  - job: acr_push
    displayName: ORAS → ACR (sha + latest)
    variables:
      ORAS_VERSION: '1.3.0'
    steps:
    - download: current
      artifact: dacpac

    # Install ORAS and expose to PATH
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ver      = '$(ORAS_VERSION)'
        $tmp      = $env:AGENT_TEMPDIRECTORY
        $zip      = Join-Path $tmp "oras_$ver.zip"
        $url      = "https://github.com/oras-project/oras/releases/download/v$ver/oras_${ver}_windows_amd64.zip"
        $extract  = Join-Path $tmp "oras_$ver"
        $bindir   = Join-Path $tmp "oras-bin"

        Write-Host "Downloading ORAS $ver from $url"
        Invoke-WebRequest -Uri $url -OutFile $zip

        if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
        Expand-Archive -Path $zip -DestinationPath $extract -Force

        $orasExe = Get-ChildItem -Path $extract -Recurse -File -Filter 'oras.exe' | Select-Object -First 1
        if (-not $orasExe) { throw "oras.exe not found under $extract" }

        if (!(Test-Path $bindir)) { New-Item -ItemType Directory -Path $bindir | Out-Null }
        Copy-Item -Path $orasExe.FullName -Destination (Join-Path $bindir 'oras.exe') -Force

        # Make ORAS available now and to subsequent tasks
        $env:PATH = "$bindir;$env:PATH"
        Write-Host "##vso[task.prependpath]$bindir"

        & (Join-Path $bindir 'oras.exe') version
      displayName: Install ORAS (Windows)

    # Login with ACR admin (or repo-scoped) creds and push DACPAC (SHA + latest)
    - powershell: |
        $ErrorActionPreference = 'Stop'

        # Resolve DACPAC from downloaded artifact
        $dacpac = "$(Pipeline.Workspace)\dacpac\$(dacpacFileName)"
        if (-not (Test-Path $dacpac)) {
          Write-Host "Expected DACPAC at: $dacpac"
          Write-Host "Listing $(Pipeline.Workspace)\dacpac for debugging:"
          Get-ChildItem -Path "$(Pipeline.Workspace)\dacpac" -File | ForEach-Object { $_.FullName }
          throw "DACPAC not found."
        }

        # Login with basic auth (already succeeded earlier)
        oras login "$(acrLoginServer)" --username "$(acrUsername)" --password "$(acrPassword)"

        $refSha    = "$(acrLoginServer)/$(acrRepository):$(acrTag)"
        $refLatest = "$(acrLoginServer)/$(acrRepository):latest"
        $artifactType = 'application/vnd.microsoft.dacpac'

        # Switch to the DACPAC's directory and push using ONLY the filename
        $dir  = Split-Path $dacpac -Parent
        $file = Split-Path $dacpac -Leaf

        if ([string]::IsNullOrWhiteSpace($file)) {
          throw "Resolved filename is empty. dacpac=`$dacpac dir=`$dir"
        }

        Push-Location $dir
        try {
          if (-not (Test-Path $file)) {
            Write-Host "Directory contents of $dir"
            Get-ChildItem -File | ForEach-Object { $_.FullName }
            throw "File '$file' not found in '$dir'."
          }

          # Build the spec as ONE argument to avoid splitting/empty value
          $spec = "${file}:$artifactType"

          Write-Host "Pushing (SHA): $refSha with spec '$spec'"
          oras push "$refSha" --artifact-type $artifactType $spec
          if ($LASTEXITCODE -ne 0) { throw "oras push (SHA) failed with exit code $LASTEXITCODE" }

          Write-Host "Pushing (latest): $refLatest with spec '$spec'"
          oras push "$refLatest" --artifact-type $artifactType $spec
          if ($LASTEXITCODE -ne 0) { throw "oras push (latest) failed with exit code $LASTEXITCODE" }
        }
        finally {
          Pop-Location
        }

        Write-Host "Done: $refSha and $refLatest"
      displayName: Push DACPAC to ACR

# -------- Deploy to Azure SQL (pull *latest* DACPAC from ACR with robust fallback) --------
- stage: DeploySql
  displayName: ACR → Azure SQL (Dev)
  dependsOn: Release
  condition: and( succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest') )
  jobs:
  - job: deploy_from_acr
    displayName: Pull latest DACPAC from ACR and deploy
    variables:
      ORAS_VERSION: '1.3.0'   # pin ORAS for repeatability
    steps:
    # Install ORAS CLI on the agent (Windows)
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ver      = '$(ORAS_VERSION)'
        $tmp      = $env:AGENT_TEMPDIRECTORY
        $zip      = Join-Path $tmp "oras_$ver.zip"
        $url      = "https://github.com/oras-project/oras/releases/download/v$ver/oras_${ver}_windows_amd64.zip"
        $extract  = Join-Path $tmp "oras_$ver"
        $bindir   = Join-Path $tmp "oras-bin"

        Write-Host "Downloading ORAS $ver from $url"
        Invoke-WebRequest -Uri $url -OutFile $zip
        if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
        Expand-Archive -Path $zip -DestinationPath $extract -Force

        $orasExe = Get-ChildItem -Path $extract -Recurse -File -Filter 'oras.exe' | Select-Object -First 1
        if (-not $orasExe) { throw "oras.exe not found under $extract" }

        if (!(Test-Path $bindir)) { New-Item -ItemType Directory -Path $bindir | Out-Null }
        Copy-Item -Path $orasExe.FullName -Destination (Join-Path $bindir 'oras.exe') -Force

        # Make ORAS available now and to subsequent tasks
        $env:PATH = "$bindir;$env:PATH"
        Write-Host "##vso[task.prependpath]$bindir"

        & (Join-Path $bindir 'oras.exe') version
      displayName: Install ORAS (Windows)

    # ORAS login (ACR admin/scoped creds from Library variable group)
    - powershell: |
        $ErrorActionPreference = 'Stop'
        if (-not "$(acrLoginServer)" -or -not "$(acrUsername)" -or -not "$(acrPassword)") {
          throw "Missing ACR credentials: acrLoginServer, acrUsername, acrPassword."
        }
        Write-Host "oras login to $(acrLoginServer) as $(acrUsername)"
        oras login "$(acrLoginServer)" --username "$(acrUsername)" --password "$(acrPassword)"
      displayName: ORAS login (ACR)

    # Pull latest DACPAC from ACR and expose its full path (with fallback if filename isn't *.dacpac)
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $refLatest = "$(acrLoginServer)/$(acrRepository):latest"
        $pullDir   = Join-Path $env:AGENT_TEMPDIRECTORY "dacpac-pull"

        if (Test-Path $pullDir) { Remove-Item -Recurse -Force $pullDir }
        New-Item -ItemType Directory -Path $pullDir | Out-Null

        Push-Location $pullDir
        try {
          Write-Host "Pulling $refLatest → $pullDir"
          # Pull all content attached to the artifact (oras pull has no --artifact-type flag)
          oras pull "$refLatest" -a

          # Prefer a *.dacpac file; fallback to MIME-type-named file if needed
          $dacpac = Get-ChildItem -Path . -Recurse -File -Filter *.dacpac | Select-Object -First 1
          if (-not $dacpac) {
            Write-Host "No *.dacpac found; checking for MIME-type named files (application*)..."
            $dacpac = Get-ChildItem -Path . -Recurse -File -Filter 'application*' | Select-Object -First 1
          }

          if (-not $dacpac) {
            Write-Host "Pulled files (none matched):"
            Get-ChildItem -Path . -Recurse | ForEach-Object { $_.FullName }
            throw "No DACPAC file found after ORAS pull."
          }

          $full = $dacpac.FullName
          Write-Host "Pulled DACPAC: $full"
          Write-Host "##vso[task.setvariable variable=DacpacPath;isOutput=true]$full"
        }
        finally {
          Pop-Location
        }
      name: fromAcr
      displayName: Pull latest DACPAC from ACR

    # Deploy the pulled DACPAC to Azure SQL (SQL auth via Library group secrets)
    - task: SqlAzureDacpacDeployment@1
      displayName: Deploy DACPAC → Azure SQL (Dev)
      inputs:
        azureSubscription: ''                 # SQL auth (no ARM conn needed)
        AuthenticationType: 'server'
        ServerName: '$(sqlServerName)'        # e.g., reefer-sense.database.windows.net
        DatabaseName: '$(sqlDatabaseName)'
        SqlUsername: '$(sqlUsername)'         # secret
        SqlPassword: '$(sqlPassword)'         # secret
        deployType: 'DacpacTask'
        DacpacFile: '$(fromAcr.DacpacPath)'
        AdditionalArguments: >
          /p:BlockOnPossibleDataLoss=false
          /p:CreateNewDatabase=false
          /v:Environment=Development
        IpDetectionMethod: 'AutoDetect'










