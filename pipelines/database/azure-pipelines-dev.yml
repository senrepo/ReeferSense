pool:
  vmImage: windows-latest     # sqlproj requires Windows image with VS

trigger:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

pr:
  branches: { include: [ dev ] }
  paths:
    include:
      - reefer-sense-db/**
      - pipelines/database/**
      - pipelines/templates/**

variables:
- group: env-dev 
- group: database-dev

# Repo-specific values
- name: project
  value: reefer-sense-db/reefer-sense-db.sqlproj
- name: dacpacFileName
  value: reefer-sense-db.dacpac
- name: buildConfiguration
  value: Release

# ACR settings project-specific
- name: acrRepository
  value: dacpacs
- name: acrTag
  value: $(Build.SourceBranchName)-$(Build.BuildId)

stages:
# -------- Build for push & PR --------
- stage: Build
  displayName: Build database (.sqlproj → .dacpac)
  jobs:
  - job: build_dacpac
    displayName: Build DACPAC (VSBuild)
    steps:
    - checkout: self

    - task: VSBuild@1
      displayName: Build SQL Project
      inputs:
        solution: '$(project)'
        msbuildArgs: '/p:Configuration=$(buildConfiguration)'
        platform: 'Any CPU'
        configuration: '$(buildConfiguration)'

    - powershell: |
        $root   = Split-Path "$(project)"
        $search = Join-Path "$(Build.SourcesDirectory)" $root
        $file   = "$(dacpacFileName)" 

        $dacpac = Get-ChildItem -Path $search -Recurse -File -Filter $file -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTimeUtc -Descending |
                  Select-Object -First 1

        if (-not $dacpac) {
          Write-Host "Searched: $search (looking for: $file)"
          throw "DACPAC not found"
        }

        # IMPORTANT: set the FULL PATH, not just the name
        Write-Host "DACPAC full path: $($dacpac.FullName)"
        Write-Host "##vso[task.setvariable variable=DacpacPath;isOutput=true]$($dacpac.FullName)"
      name: outvars
      displayName: Locate DACPAC

    - task: PublishPipelineArtifact@1
      displayName: Publish DACPAC (pipeline artifact)
      inputs:
        targetPath: '$(outvars.DacpacPath)'
        artifact: 'dacpac'
        publishLocation: 'pipeline'

# -------- Release (skip on PRs) --------
- stage: Release
  displayName: Push DACPAC to ACR (Dev)
  dependsOn: Build
  condition: and( succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest') )
  jobs:
  - job: acr_push
    displayName: ORAS → ACR (sha + latest) on Windows
    variables:
      ORAS_VERSION: '1.3.0'
    steps:
    - download: current
      artifact: dacpac

    - task: AzureCLI@2
      displayName: Install ORAS + ACR token login + Push (Windows, single step)
      inputs:
        azureSubscription: '$(azureSubscription)'  # from env-dev variable group
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          # --- Install ORAS ---
          $ver   = '$(ORAS_VERSION)'
          $tmp   = $env:AGENT_TEMPDIRECTORY
          $zip   = Join-Path $tmp "oras_$ver.zip"
          $url   = "https://github.com/oras-project/oras/releases/download/v$ver/oras_${ver}_windows_amd64.zip"
          $out   = Join-Path $tmp "oras_$ver"
          $bin   = Join-Path $tmp "oras-bin"

          Write-Host "Azure context:"; az account show -o table

          Write-Host "Downloading ORAS $ver from $url"
          Invoke-WebRequest -Uri $url -OutFile $zip

          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          Expand-Archive -Path $zip -DestinationPath $out -Force

          $orasExe = Get-ChildItem -Path $out -Recurse -File -Filter 'oras.exe' | Select-Object -First 1
          if (-not $orasExe) { throw "oras.exe not found under $out" }

          if (!(Test-Path $bin)) { New-Item -ItemType Directory -Path $bin | Out-Null }
          Copy-Item -Path $orasExe.FullName -Destination (Join-Path $bin 'oras.exe') -Force
          $env:PATH = "$bin;$env:PATH"
          Write-Host "##vso[task.prependpath]$bin"

          # Verify ORAS
          & (Join-Path $bin 'oras.exe') version

          # --- Resolve DACPAC path ---
          $dacpac = "$(Pipeline.Workspace)\dacpac\$(dacpacFileName)"
          if (-not (Test-Path $dacpac)) {
            Write-Host "Contents of $(Pipeline.Workspace)\dacpac:"
            Get-ChildItem -Path "$(Pipeline.Workspace)\dacpac" -Recurse | ForEach-Object { $_.FullName }
            throw "DACPAC not found at $dacpac"
          }
          Write-Host "DACPAC: $dacpac"

          # --- ACR token + ORAS login ---
          Write-Host "Minting ACR access token for $(acrName)…"
          $token = az acr login --name "$(acrName)" --expose-token --query accessToken -o tsv
          if (-not $token) { throw "Failed to obtain ACR access token. Check service connection / acrName." }

          # Use password-stdin to avoid echoing secrets; check exit code explicitly
          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = "oras"
          $pinfo.Arguments = "login $(acrLoginServer) --username 00000000-0000-0000-0000-000000000000 --password-stdin"
          $pinfo.RedirectStandardInput = $true
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError  = $true
          $pinfo.UseShellExecute = $false
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $pinfo
          $null = $proc.Start()
          $proc.StandardInput.Write($token)
          $proc.StandardInput.Close()
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          Write-Host $stdout
          if ($proc.ExitCode -ne 0) {
            Write-Error $stderr
            throw "oras login failed with exit code $($proc.ExitCode)"
          }

          # --- Build refs ---
          $refSha    = "$(acrLoginServer)/$(acrRepository):$(acrTag)"
          $refLatest = "$(acrLoginServer)/$(acrRepository):latest"
          Write-Host "Targets:`n  SHA: $refSha`n  Latest: $refLatest"

          # --- Windows-safe push: cd to file dir and use only the filename in file:mediatype ---
          $dir  = Split-Path $dacpac -Parent
          $file = Split-Path $dacpac -Leaf
          Set-Location $dir

          Write-Host "Pushing (SHA)…"
          oras push "$refSha" --artifact-type application/vnd.microsoft.dacpac "$file:application/vnd.microsoft.dacpac"
          if ($LASTEXITCODE -ne 0) { throw "oras push (SHA) failed with exit code $LASTEXITCODE" }

          Write-Host "Pushing (latest)…"
          oras push "$refLatest" --artifact-type application/vnd.microsoft.dacpac "$file:application/vnd.microsoft.dacpac"
          if ($LASTEXITCODE -ne 0) { throw "oras push (latest) failed with exit code $LASTEXITCODE" }

          Write-Host "Done: $refSha and $refLatest"





