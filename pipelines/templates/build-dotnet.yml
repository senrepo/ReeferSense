parameters:
  project: ''                # e.g., iot-gateway/iot-gateway.csproj
  configuration: 'Release'

jobs:
- job: build
  displayName: Build .NET (project-only)
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  # Cache the default NuGet package folder on linux agents
  - task: Cache@2
    displayName: Cache NuGet
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/Directory.Packages.props | **/*.csproj | **/*.props | **/*.targets | **/global.json'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: $(HOME)/.nuget/packages

  # Restore ONLY the project (not the whole solution)
  - script: dotnet restore "${{ parameters.project }}"
    displayName: Restore (project)

  # Build ONLY the project (will still build its referenced projects if needed)
  - script: dotnet build "${{ parameters.project }}" -c ${{ parameters.configuration }} --no-restore
    displayName: Build (project)

  # Publish from the already-built project output (no rebuild)
  - script: dotnet publish "${{ parameters.project }}" -c ${{ parameters.configuration }} --no-build -o "$(Build.ArtifactStagingDirectory)/app"
    displayName: Publish (project)

  - task: PublishPipelineArtifact@1
    displayName: Publish artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: 'publish'
      publishLocation: 'pipeline'
