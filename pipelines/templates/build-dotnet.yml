parameters:
  solution: ''
  project: ''
  configuration: 'Release'

jobs:
- job: build
  displayName: Build .NET
  pool: { vmImage: 'ubuntu-latest' }
  steps:
  - task: UseDotNet@2
    inputs: { packageType: 'sdk', version: '8.0.x' }

  - task: Cache@2
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/*.sln'
      path: ~/.nuget/packages
      restoreKeys: 'nuget | "$(Agent.OS)"'

  - script: dotnet restore "${{ parameters.solution }}"
    displayName: Restore

  - script: dotnet build "${{ parameters.project }}" -c ${{ parameters.configuration }} --no-restore
    displayName: Build

  - script: dotnet publish "${{ parameters.project }}" -c ${{ parameters.configuration }} -o "$(Build.ArtifactStagingDirectory)/app"
    displayName: Publish

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: 'publish'
      publishLocation: 'pipeline'
