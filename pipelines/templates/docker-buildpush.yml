# /pipelines/templates/docker-buildpush.yml
parameters:
  containerRegistryServiceConnection: ''                  
  repository: ''               
  projectPath: ''   
  entryDll: ''    
  buildConfiguration: 'Release'  
  tags: |
    $(Build.SourceBranchName)-$(Build.BuildId)
    $(Build.SourceBranchName)-latest

jobs:
- job: docker_build_push
  displayName: Docker Build & Push
  steps:
  - checkout: self

  - task: Docker@2
    displayName: Login to ACR
    inputs:
      command: login
      containerRegistry: ${{ parameters.containerRegistryServiceConnection }}

  - task: NuGetAuthenticate@1
    displayName: 'NuGet Authenticate (Azure Artifacts)'
    inputs:
      nuGetServiceConnections: 'ReeferSense-Artifacts-Connection'
      nuGetConfigPath: '$(Build.SourcesDirectory)/NuGet.config'

  # Restore & publish ON THE AGENT using the authenticated client
  - script: |
      set -e
      dotnet --info
      dotnet restore "${{ parameters.projectPath }}" \
        --configfile "$(Build.SourcesDirectory)/NuGet.config"
      dotnet publish  "${{ parameters.projectPath }}" \
        -c "${{ parameters.buildConfiguration }}" \
        -o "$(Build.SourcesDirectory)/_publish" \
        --no-restore \
        /p:UseAppHost=false
      ls -la "$(Build.SourcesDirectory)/_publish"
    displayName: dotnet restore + publish (agent)

  # Create a slim runtime Dockerfile next to the publish output
  - bash: |
      cat > "$(Build.SourcesDirectory)/_publish/Dockerfile.runtime" <<EOF
      FROM mcr.microsoft.com/dotnet/aspnet:8.0
      WORKDIR /app
      COPY . .
      ENTRYPOINT ["dotnet","${{ parameters.entryDll }}"]
      EOF
      echo "Created Dockerfile.runtime in _publish (ENTRYPOINT -> ${{ parameters.entryDll }})"
    displayName: Create runtime Dockerfile

  # Build & push the image from the *publish folder* as build context
  - task: Docker@2
    displayName: Build & Push runtime image
    inputs:
      command: buildAndPush
      containerRegistry: ${{ parameters.containerRegistryServiceConnection }}
      repository: ${{ parameters.repository }}
      Dockerfile: '$(Build.SourcesDirectory)/_publish/Dockerfile.runtime'
      buildContext: '$(Build.SourcesDirectory)/_publish'
      tags: ${{ parameters.tags }}
