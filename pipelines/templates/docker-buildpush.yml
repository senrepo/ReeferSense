# /pipelines/templates/docker-buildpush.yml
parameters:
  containerRegistryServiceConnection: ''                 # e.g., 'acr-dev'
  repository: ''                                         # e.g., 'iot-gateway'
  dockerfilePath: ''                                     # e.g., 'Dockerfile.iogw'
  buildContext: '$(Pipeline.Workspace)/publish/app'      # default context from publish
  tags: |
    $(Build.SourceBranchName)-$(Build.BuildId)
    $(Build.SourceBranchName)-latest

jobs:
- job: docker_build_push
  displayName: Docker Build & Push
  steps:
  - download: current
    artifact: publish

  - task: Docker@2
    displayName: Login to ACR
    inputs:
      command: login
      containerRegistry: ${{ parameters.containerRegistryServiceConnection }}

  - task: NuGetAuthenticate@1
    displayName: 'NuGet Authenticate (Azure Artifacts)'
    inputs:
      nuGetServiceConnections: 'ReeferSense-Artifacts-Connection' 
      nuGetConfigPath: '$(Build.SourcesDirectory)/NuGet.config'

  - bash: |
        if [ -z "$VSS_NUGET_EXTERNAL_FEED_ENDPOINTS" ]; then
          echo "Auth JSON is EMPTY at agent scope"; exit 1
        fi
        # base64 (single line, no wraps)
        auth_b64="$(printf %s "$VSS_NUGET_EXTERNAL_FEED_ENDPOINTS" | base64 -w0 2>/dev/null || printf %s "$VSS_NUGET_EXTERNAL_FEED_ENDPOINTS" | base64)"
        echo "##vso[task.setvariable variable=nugetAuthB64;issecret=true]$auth_b64"
        echo "Promoted nugetAuthB64 (masked)"
    displayName: "Encode & promote NuGet auth JSON"


  - task: Docker@2
    displayName: Build & Push
    inputs:
      command: buildAndPush
      repository: ${{ parameters.repository }}
      containerRegistry: ${{ parameters.containerRegistryServiceConnection }}
      Dockerfile: ${{ parameters.dockerfilePath }}
      buildContext: '$(Build.SourcesDirectory)'
      arguments: >
        --build-arg VSS_NUGET_EXTERNAL_FEED_ENDPOINTS=$(nugetAuthB64)
      tags: ${{ parameters.tags }}
