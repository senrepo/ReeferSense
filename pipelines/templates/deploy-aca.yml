parameters:
  azureSubscriptionVar: 'azureSubscription'
  acrLoginServerVar:   'acrLoginServer'
  resourceGroupVar:    'resourceGroup'
  containerAppVar:     'containerApp'
  acaEnvironmentVar:   'acaEnvironment'  

jobs:
- job: deploy_aca
  displayName: Deploy to Azure Container Apps
  steps:
  - task: AzureCLI@2
    displayName: "Create or Update Container App"
    inputs:
      azureSubscription: ${{ variables[ parameters.azureSubscriptionVar ] }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        RG="${{ variables[ parameters.resourceGroupVar ] }}"
        APP="${{ variables[ parameters.containerAppVar ] }}"
        ENV_NAME="${{ variables[ parameters.acaEnvironmentVar ] }}"
        ACR_LOGIN="${{ variables[ parameters.acrLoginServerVar ] }}"
        IMAGE="${ACR_LOGIN}/$(imageName):$(Build.SourceBranchName)-$(Build.BuildId)"
        DOTNET_ENV="$(dotnetEnvironment)"

        echo "Target RG=${RG}, App=${APP}, Env=${ENV_NAME}, Image=${IMAGE}"

        if ! az containerapp show -n "${APP}" -g "${RG}" >/dev/null 2>&1; then
          echo "Creating Container App ${APP}…"
          ACR_NAME="$(echo "${ACR_LOGIN}" | cut -d. -f1)"
          az acr update -n "${ACR_NAME}" --admin-enabled true 1>/dev/null
          ACR_USER="$(az acr credential show -n "${ACR_NAME}" --query username -o tsv)"
          ACR_PASS="$(az acr credential show -n "${ACR_NAME}" --query passwords[0].value -o tsv)"

          az containerapp create \
            --name "${APP}" \
            --resource-group "${RG}" \
            --environment "${ENV_NAME}" \
            --image "${IMAGE}" \
            --registry-server "${ACR_LOGIN}" \
            --registry-username "${ACR_USER}" \
            --registry-password "${ACR_PASS}" \
            --set-env-vars \
              "DOTNET_ENVIRONMENT=${DOTNET_ENV}" \
              "SERVICEBUS__CONNECTION_STRING=$(SB_CONNECTION_STRING)" \
              "SERVICEBUS__QUEUENAME=$(QUEUE_NAME)"
        else
          echo "Updating Container App ${APP}…"
          az containerapp update \
            --name "${APP}" \
            --resource-group "${RG}" \
            --image "${IMAGE}" \
            --set-env-vars \
              "DOTNET_ENVIRONMENT=${DOTNET_ENV}" \
              "SERVICEBUS__CONNECTION_STRING=$(SB_CONNECTION_STRING)" \
              "SERVICEBUS__QUEUENAME=$(QUEUE_NAME)"
        fi
